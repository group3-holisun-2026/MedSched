spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medsched_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:medsched2026@gmail.com}
    # Fara valoare implicita aplicatia nu mai porneste la nimeni care nu are variabila setata.
    # Contul real se seteaza doar prin env, la demo (impreuna cu EMAIL_ENABLED=true).
    password: ${ACCOUNT_PASSWORD:}

  jpa:
    hibernate:
      # Schema e detinuta de Flyway (V1..V9), nu de Hibernate.
      #
      # A fost `update` pana acum, dar asta a mascat faptul ca Flyway nu rula deloc: lipsea
      # `spring-boot-flyway` (autoconfiguratia) din pom, deci migratiile nu se aplicasera niciodata
      # nicaieri, iar tabelele existau doar pentru ca le crea Hibernate. `validate` face ca o
      # diferenta intre entitati si migratii sa iasa la pornire, nu la deploy.
      #
      # ATENTIE, o singura data: daca ai deja o baza `medsched_dev` construita de Hibernate, Flyway
      # va esua cu "relation already exists". Reseteaz-o o data:
      #   DROP DATABASE medsched_dev; CREATE DATABASE medsched_dev;
      # Dupa asta migratiile ruleaza singure la fiecare pornire.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect