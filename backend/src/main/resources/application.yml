spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medsched_db
    username:
    password:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  application:
    name: backend
  profiles:
    active: dev # Profilul care pornește implicit dacă nu specifici altul

  mail:
    host: ${SPRING_MAIL_HOST:smtp.example.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-32-bytes-minimum}
    access-token-expiration-ms: 900000 # 15 minute
    refresh-token-expiration-ms: 604800000 # 7 zile
  encryption:
    secret: "1234567890123456" # 16 caractere necesare pentru AES
  email:
    enabled: ${EMAIL_ENABLED:false}
    from-address: ${EMAIL_FROM_ADDRESS:no-reply@medsched.com}
  notifications:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  reports:
    clinic-open-time: "08:00"
    clinic-close-time: "20:00"
    clinic-working-days: MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY